<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>РОЗКЛАД НТУ ДП // G7 + ДОШКА ГАНЬБИ</title>

  <!-- Жирні шрифти з сильним характером -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@600;700;900&display=swap" rel="stylesheet">

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #F4EFE6;
      --black: #0F0F11;
      --white: #FFFFFF;
      
      --lime: #B4D97A;
      --pink: #D6469B;
      --yellow: #E8B93E;
      --cyan: #3FBFA8;
      --blue: #4A63C9;
      --orange: #D9702E;
      --purple: #9B7FD4;
      --red: #D6455E;
      
      --cal-theory: #C7DCEF;
      --cal-control: #E8B93E;
      --cal-session: #D6469B;
      --cal-vacation: #A9D9AE;
      --cal-practice: #EDE2AE;

      --border-thick: 3.5px solid var(--black);
      --shadow-hard: 6px 6px 0px var(--black);
      --shadow-hard-lg: 9px 9px 0px var(--black);
      --shadow-hard-sm: 3px 3px 0px var(--black);
      
      --bounce-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--black);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: radial-gradient(rgba(0,0,0,0.045) 1px, transparent 0);
      background-size: 28px 28px;
      position: relative;
    }

    .bg-floating-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      font-size: 1.8rem;
      user-select: none;
      opacity: 0.35;
      filter: drop-shadow(2px 2px 0px var(--black));
      animation: floatDrift linear infinite alternate;
      will-change: transform;
    }

    @keyframes floatDrift {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      50% { transform: translate(25px, -35px) rotate(15deg) scale(1.1); }
      100% { transform: translate(-20px, 20px) rotate(-12deg) scale(0.95); }
    }

    .app-container {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      position: relative;
      z-index: 10;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      position: relative;
    }

    @media (min-width: 900px) {
      .header {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-end;
      }
    }

    .header-main {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .badge-pill {
      background: var(--yellow);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard-sm);
      font-weight: 900;
      font-size: 0.8rem;
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      transform: rotate(-2deg);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }

    .badge-pill.pink {
      background: var(--pink);
      color: var(--white);
      transform: rotate(2deg);
    }

    .badge-pill.cyan {
      background: var(--cyan);
      color: var(--black);
      transform: rotate(-1deg);
    }

    .main-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      color: var(--black);
      position: relative;
    }

    .main-title span {
      display: inline-block;
      background: var(--lime);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard);
      padding: 0 0.4rem;
      transform: rotate(-1deg);
      margin-left: 0.2rem;
    }

    .controls-wrapper {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.85rem;
    }

    .btn-brutal {
      background: var(--white);
      color: var(--black);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard);
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.92rem;
      text-transform: uppercase;
      padding: 0.8rem 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.15s var(--bounce-ease), box-shadow 0.15s ease-out, background-color 0.15s ease;
      user-select: none;
    }

    .btn-brutal:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px var(--black);
    }

    .btn-brutal:active {
      transform: translate(4px, 4px) !important;
      box-shadow: 1px 1px 0px var(--black) !important;
    }

    .btn-brutal.active {
      background: var(--cyan);
      box-shadow: var(--shadow-hard);
    }

    .btn-brutal.pink-accent.active {
      background: var(--pink);
      color: var(--white);
    }

    .btn-brutal.yellow-accent.active {
      background: var(--yellow);
      color: var(--black);
    }

    .btn-brutal.red-accent {
      background: var(--red);
      color: var(--white);
    }

    .btn-brutal.red-accent.active {
      background: var(--red);
      color: var(--white);
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 640px) {
      .schedule-grid {
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      }
    }

    @media (min-width: 1250px) {
      .schedule-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .schedule-grid.today-only {
      display: flex;
      justify-content: center;
    }

    .schedule-grid.today-only .day-card {
      max-width: 580px;
      width: 100%;
      transform: rotate(0deg) !important;
    }

    .day-card {
      background: var(--white);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard-lg);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: visible;
      transition: transform 0.2s var(--bounce-ease), box-shadow 0.2s ease-out;
      position: relative;
      backface-visibility: hidden;
    }

    .day-card:nth-child(1) { transform: rotate(-0.8deg); }
    .day-card:nth-child(2) { transform: rotate(0.8deg); }
    .day-card:nth-child(3) { transform: rotate(-1.1deg); }
    .day-card:nth-child(4) { transform: rotate(0.6deg); }
    .day-card:nth-child(5) { transform: rotate(-0.7deg); }

    .day-card.is-today {
      box-shadow: 10px 10px 0px var(--pink) !important;
      border-color: var(--black);
      outline: 4px solid var(--black);
    }

    .day-header {
      padding: 1.2rem 1.1rem 1rem;
      border-bottom: var(--border-thick);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--yellow);
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      position: relative;
    }

    .day-card:nth-child(1) .day-header { background: var(--yellow); }
    .day-card:nth-child(2) .day-header { background: var(--cyan); }
    .day-card:nth-child(3) .day-header { background: var(--pink); color: #fff; }
    .day-card:nth-child(4) .day-header { background: var(--lime); }
    .day-card:nth-child(5) .day-header { background: var(--orange); color: #fff; }

    .day-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.35rem;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }

    .day-meta-badge {
      font-size: 0.75rem;
      font-weight: 900;
      background: var(--black);
      color: var(--white);
      padding: 0.25rem 0.55rem;
      border-radius: 6px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .pairs-body {
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: #FAFAFA;
      flex: 1;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }

    .pair-block {
      background: var(--white);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard-sm);
      border-radius: 8px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      position: relative;
      transition: transform 0.15s var(--bounce-ease), box-shadow 0.15s ease-out, background-color 0.2s ease;
      user-select: none;
    }

    .pair-block:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--black);
    }

    @keyframes pairBreathing {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.018);
      }
    }

    .pair-block.is-current-pair {
      animation: pairBreathing 3.2s ease-in-out infinite;
      border-color: var(--pink) !important;
      outline: 3px solid var(--pink);
      background: #FFF9FE;
      box-shadow: 6px 6px 0px var(--pink);
      z-index: 5;
      will-change: transform;
    }

    .pair-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .pair-number {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.8rem;
      background: var(--black);
      color: var(--white);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .pair-hours {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--black);
      background: var(--bg);
      border: 2px solid var(--black);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
    }

    .live-badge {
      background: var(--pink);
      color: var(--white);
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      border: 1.5px solid var(--black);
      animation: blinker 1.5s ease-in-out infinite;
    }

    @keyframes blinker {
      50% { opacity: 0.6; }
    }

    .pair-name {
      font-size: 0.98rem;
      font-weight: 900;
      line-height: 1.25;
      word-break: break-word;
    }

    .pair-footer {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-top: 0.2rem;
      padding-top: 0.4rem;
      border-top: 2px dashed rgba(0,0,0,0.15);
    }

    .teacher-tag {
      font-size: 0.8rem;
      font-weight: 800;
      background: var(--lime);
      border: 2px solid var(--black);
      padding: 0.2rem 0.5rem;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .pair-block.is-window {
      background: var(--bg);
      border: 3px dashed var(--black);
      box-shadow: none;
      padding: 0.9rem;
    }

    .window-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.92rem;
      color: var(--black);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .window-subtitle {
      font-size: 0.8rem;
      font-weight: 700;
      color: #666;
    }

    .weekend-card {
      grid-column: 1 / -1;
      background: var(--yellow);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard-lg);
      border-radius: 16px;
      padding: 4rem 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      transform: rotate(-1deg);
    }

    .weekend-card h2 {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(2rem, 4vw, 3rem);
      text-transform: uppercase;
    }

    .calendar-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
    }

    .calendar-box {
      background: var(--white);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard-lg);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .calendar-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .legend-container.sticky-legend {
      position: sticky;
      top: 48px;
      z-index: 85;
      background: var(--white);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard);
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
    }

    .legend-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.88rem;
      text-transform: uppercase;
      color: var(--black);
      background: var(--yellow);
      border: 2px solid var(--black);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      box-shadow: 2px 2px 0px var(--black);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.84rem;
      font-weight: 900;
    }

    .legend-color-box {
      width: 20px;
      height: 20px;
      border: 2px solid var(--black);
      border-radius: 5px;
      box-shadow: 2px 2px 0px var(--black);
    }

    .legend-color-box.theory { background: var(--cal-theory); }
    .legend-color-box.control { background: var(--cal-control); }
    .legend-color-box.session { background: var(--cal-session); }
    .legend-color-box.vacation { background: var(--cal-vacation); }
    .legend-color-box.practice { background: var(--cal-practice); }

    .legend-text-num {
      color: #1E3A8A;
      font-weight: 900;
      font-family: 'Space Grotesk', sans-serif;
      background: var(--white);
      border: 2px solid var(--black);
      padding: 0 0.35rem;
      border-radius: 4px;
      box-shadow: 2px 2px 0px var(--black);
    }

    .legend-text-den {
      color: var(--black);
      font-weight: 800;
      background: var(--white);
      border: 2px solid var(--black);
      padding: 0 0.35rem;
      border-radius: 4px;
      box-shadow: 2px 2px 0px var(--black);
    }

    .months-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 640px) {
      .months-grid {
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      }
    }

    @media (min-width: 1280px) {
      .months-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .month-card {
      background: var(--white);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard);
      border-radius: 12px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      position: relative;
      transition: transform 0.2s var(--bounce-ease), box-shadow 0.2s ease-out, opacity 0.2s ease;
    }

    .month-card.is-current-month {
      border: 4px solid var(--black) !important;
      box-shadow: 9px 9px 0px var(--pink) !important;
      opacity: 1 !important;
      z-index: 10;
    }

    .month-card.is-other-month {
      opacity: 0.88;
    }

    .month-card.is-other-month:hover {
      opacity: 1;
      transform: translateY(-4px);
      box-shadow: 8px 8px 0px var(--black);
    }

    .current-month-sticker {
      position: absolute;
      top: -14px;
      right: 14px;
      background: var(--pink);
      color: var(--white);
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.78rem;
      padding: 0.3rem 0.7rem;
      border: 2.5px solid var(--black);
      box-shadow: var(--shadow-hard-sm);
      transform: rotate(3deg);
      border-radius: 6px;
      z-index: 25;
      pointer-events: none;
    }

    .month-name {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.15rem;
      text-transform: uppercase;
      padding-bottom: 0.5rem;
      border-bottom: var(--border-thick);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .month-strip {
      background: var(--white);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard-sm);
      border-radius: 10px;
      padding: 0.85rem 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .month-strip:hover {
      background: var(--yellow);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--black);
    }

    .cal-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
    }

    .cal-table th {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.82rem;
      padding: 0.4rem 0.2rem;
      text-align: center;
      background: var(--yellow);
      border: 2px solid var(--black);
      border-radius: 4px;
      box-shadow: 2px 2px 0px var(--black);
    }

    .cal-cell {
      width: 14.28%;
      height: 38px;
      text-align: center;
      vertical-align: middle;
      font-weight: 800;
      font-size: 0.88rem;
      border: 2px solid var(--black);
      border-radius: 6px;
      position: relative;
      box-shadow: 2px 2px 0px var(--black);
      user-select: none;
      transition: transform 0.12s ease;
      z-index: 1;
    }

    .cal-cell:hover {
      transform: scale(1.15);
      z-index: 50;
      transition: transform 0.12s ease;
    }

    .cal-cell.empty {
      border: none;
      box-shadow: none;
      background: transparent;
    }

    .cal-cell.type-theory { background: var(--cal-theory); }
    .cal-cell.type-control { background: var(--cal-control); }
    .cal-cell.type-session { background: var(--cal-session); color: #fff; }
    .cal-cell.type-vacation { 
      background: var(--cal-vacation); 
      background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(0,0,0,0.05) 4px, rgba(0,0,0,0.05) 8px);
    }
    .cal-cell.type-practice { background: var(--cal-practice); }

    .cal-cell.is-numerator {
      color: #1E3A8A;
      font-weight: 900;
      font-size: 0.98rem;
    }

    @keyframes pulseToday {
      0%, 100% {
        box-shadow: 0 0 0 0px rgba(255, 51, 102, 0.9), 3px 3px 0px var(--black);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 6px rgba(255, 51, 102, 0.4), 4px 4px 0px var(--black);
        transform: scale(1.12);
      }
    }

    .cal-cell.is-today-cell {
      border: 3.5px solid var(--black) !important;
      outline: 3.5px solid var(--red) !important;
      background: var(--lime) !important;
      color: var(--black) !important;
      font-weight: 900 !important;
      z-index: 40;
      animation: pulseToday 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .cell-sticker-icon {
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 0.72rem;
      line-height: 1;
      pointer-events: none;
      filter: drop-shadow(1px 1px 0px var(--black));
    }

    .student-day-ring {
      border: 3px dashed var(--black) !important;
      background: #E0C3FC !important;
      cursor: pointer;
    }

    .shame-subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: -0.5rem;
    }

    .shame-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      width: 100%;
    }

    .shame-header-box {
      background: var(--white);
      border: var(--border-thick);
      box-shadow: var(--shadow-hard-lg);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
    }

    @media (min-width: 768px) {
      .shame-header-box {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .shame-title-area {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .shame-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .shame-subtitle {
      font-size: 0.95rem;
      font-weight: 800;
      color: #555;
    }

    .shame-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.75rem;
    }

    @media (min-width: 640px) {
      .shame-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
    }

    .shame-card {
      background: #F7F5F0;
      border: 2.5px solid var(--black);
      box-shadow: 5px 5px 0px var(--black);
      border-radius: 14px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;

    function getCurrentPairNum() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      for (const [num, slot] of Object.entries(timeSlots)) {
        if (currentMinutes >= slot.start && currentMinutes <= slot.end) {
          return parseInt(num, 10);
        }
      }
      return null;
    }

    function updateClockAndCountdown() {
      const now = new Date();
      const clockEl = document.getElementById('liveClock');
      const dayOfWeek = now.getDay(); // 0 = Нд, 1 = Пн, ... 6 = Сб
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const currentSeconds = now.getSeconds();

      let statusText = "";

      const todayData = scheduleData.find(d => d.dayId === dayOfWeek);

      if (todayData) {
        let activePair = null;
        let nextPair = null;

        for (const p of todayData.pairs) {
          const slot = timeSlots[p.num];
          if (!slot) continue;

          if (currentMinutes >= slot.start && currentMinutes < slot.end) {
            activePair = p;
            break;
          }
          if (currentMinutes < slot.start && !nextPair) {
            nextPair = p;
          }
        }

        if (activePair) {
          const slot = timeSlots[activePair.num];
          const remainingSec = (slot.end * 60) - (currentMinutes * 60 + currentSeconds);
          const mins = Math.floor(remainingSec / 60);
          const secs = remainingSec % 60;
          const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
          statusText = `⏳ До кінця #${activePair.num} пари: ${formatted}`;
        } else if (nextPair) {
          const slot = timeSlots[nextPair.num];
          const untilSec = (slot.start * 60) - (currentMinutes * 60 + currentSeconds);
          const mins = Math.floor(untilSec / 60);
          const secs = untilSec % 60;
          const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
          statusText = `⏰ До #${nextPair.num} пари: ${formatted}`;
        }
      }

      if (!statusText) {
        let daysToAdd = 1;
        let targetDayId = (dayOfWeek + 1) % 7;
        
        while (targetDayId === 0 || targetDayId === 6 || !scheduleData.some(d => d.dayId === targetDayId)) {
          daysToAdd++;
          targetDayId = (targetDayId + 1) % 7;
        }

        const nextDayData = scheduleData.find(d => d.dayId === targetDayId);
        const firstPairNum = nextDayData.pairs[0].num;
        const firstSlot = timeSlots[firstPairNum];

        const targetDate = new Date(now);
        targetDate.setDate(now.getDate() + daysToAdd);
        targetDate.setHours(Math.floor(firstSlot.start / 60), firstSlot.start % 60, 0, 0);

        const diffMs = targetDate - now;
        const totalSec = Math.floor(diffMs / 1000);
        const d = Math.floor(totalSec / (3600 * 24));
        const h = Math.floor((totalSec % (3600 * 24)) / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;

        const timeStr = `${d > 0 ? d + 'д ' : ''}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        statusText = `⏰ До #${firstPairNum} пари (${nextDayData.dayName}): ${timeStr}`;
      }

      if (clockEl) {
        clockEl.textContent = statusText;
      }
    }

    function renderCalendar() {
      const grid = document.getElementById('monthsGrid');
      if (!grid) return;

      grid.innerHTML = '';

      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonthIdx = now.getMonth();
      const currentDayDate = now.getDate();

      monthsData.forEach((m, idx) => {
        // Dynamic ISO day-of-week calculation (0 = Mon, 6 = Sun)
        const startDayOfWeek = (new Date(m.year, m.monthIdx, 1).getDay() + 6) % 7;
        const daysInMonth = new Date(m.year, m.monthIdx + 1, 0).getDate();

        const isCurrentMonth = (m.year === currentYear && m.monthIdx === currentMonthIdx);
        const isNextMonth = (idx > 0 && monthsData[idx - 1].year === currentYear && monthsData[idx - 1].monthIdx === currentMonthIdx);

        if (!(m.id in collapsedMonthsState)) {
          collapsedMonthsState[m.id] = !(isCurrentMonth || isNextMonth);
        }

        const isCollapsed = collapsedMonthsState[m.id];

        if (isCollapsed) {
          const strip = document.createElement('div');
          strip.className = 'month-strip';
          strip.onclick = () => toggleMonth(m.id);
          strip.innerHTML = `
            <span style="font-family: 'Archivo Black', sans-serif; text-transform: uppercase;">
              ${m.name} ${isCurrentMonth ? '🔥 [ПОТОЧНИЙ]' : ''}
            </span>
            <span class="btn-brutal" style="padding: 0.25rem 0.6rem; font-size: 0.75rem;">РОЗГОРНУТИ ➕</span>
          `;
          grid.appendChild(strip);
          return;
        }

        const card = document.createElement('div');
        card.className = `month-card ${isCurrentMonth ? 'is-current-month' : 'is-other-month'}`;

        let stickerHtml = isCurrentMonth ? `<div class="current-month-sticker">🔥 ЗАРАЗ 👈</div>` : '';

        let tableHtml = `
          <table class="cal-table">
            <thead>
              <tr>
                <th>Пн</th><th>Вт</th><th>Ср</th><th>Чт</th><th>Пт</th><th>Сб</th><th>Нд</th>
              </tr>
            </thead>
            <tbody>
        `;

        let cellCounter = 0;
        let dayCounter = 1;
        let isNumerator = m.isNumeratorStart;

        for (let row = 0; row < 6; row++) {
          let rowHtml = '<tr>';
          let hasDaysInRow = false;

          for (let col = 0; col < 7; col++) {
            if (cellCounter < startDayOfWeek || dayCounter > daysInMonth) {
              rowHtml += `<td class="cal-cell empty"></td>`;
            } else {
              hasDaysInRow = true;
              const dNum = dayCounter;
              const isTodayCell = (isCurrentMonth && dNum === currentDayDate);

              let cellClass = 'cal-cell';
              let emojiIcon = '';

              if (m.sessionDays.includes(dNum)) {
                cellClass += ' type-session';
                emojiIcon = '<span class="cell-sticker-icon">💀</span>';
              } else if (m.controlDays.includes(dNum)) {
                cellClass += ' type-control';
              } else if (m.vacationDays.includes(dNum)) {
                cellClass += ' type-vacation';
              } else if (m.practiceDays.includes(dNum)) {
                cellClass += ' type-practice';
              } else {
                cellClass += ' type-theory';
              }

              if (isNumerator) cellClass += ' is-numerator';
              if (isTodayCell) cellClass += ' is-today-cell';

              let onClickAttr = '';
              if (m.studentDay === dNum) {
                cellClass += ' student-day-ring';
                emojiIcon = '<span class="cell-sticker-icon">🎉</span>';
                onClickAttr = `onclick="triggerStudentDayEasterEgg(event)" title="День студента! Натисни для салюту"`;
              }

              rowHtml += `
                <td class="${cellClass}" ${onClickAttr}>
                  ${dNum}
                  ${emojiIcon}
                </td>
              `;
              dayCounter++;
            }

            cellCounter++;

            if (col === 6 && dayCounter <= daysInMonth) {
              isNumerator = !isNumerator;
            }
          }

          rowHtml += '</tr>';
          if (hasDaysInRow) tableHtml += rowHtml;
        }

        tableHtml += `</tbody></table>`;

        card.innerHTML = `
          ${stickerHtml}
          <div class="month-name">
            <span>${m.name}</span>
            <button class="btn-brutal" style="padding: 0.2rem 0.5rem; font-size: 0.72rem;" onclick="toggleMonth('${m.id}')">
              ЗГОРНУТИ ✕
            </button>
          </div>
          ${tableHtml}
        `;

        grid.appendChild(card);
      });
    }

    function getTotalReactions(entry) {

      return entries;

            .from('board_entries')
            .select('*')
            .order('created_at', { ascending: false });

          if (data && data.length > 0) {
            cachedShameEntries = data;

            cachedShameEntries = initialDemoShameEntries;

          console.warn("Supabase load error (using fallback):", err);
          cachedShameEntries = initialDemoShameEntries;

      } else {

      renderShameGrid(getFilteredShameEntries(cachedShameEntries));

          <div class="shame-date">🗓️ ${dateStr}</div>

          <div class="reactions-bar" id="reactions-bar-${item.id}">${reactionsHtml}</div>

          <button class="comments-toggle-btn" onclick="toggleComments(${item.id}, this)">💬 Коментарі</button>

          <div class="comments-section" id="comments-section-${item.id}">
            <div class="comments-list" id="comments-list-${item.id}">
              <div class="comment-empty">⏳ Завантаження...</div>
            </div>
            <form class="comment-form" onsubmit="handleCommentSubmit(event, ${item.id})">
              <input type="text" class="comment-author-input" placeholder="Ім'я" required maxlength="40" />
              <textarea class="comment-text-input" placeholder="Написати коментар..." required maxlength="300"></textarea>
              <button type="submit" class="comment-submit-btn">Надіслати</button>
            </form>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // ------------------------------------------------------------------
    // Захист від спаму реакціями - одна реакція на пост з одного браузера
    // ------------------------------------------------------------------
    function getUserReactionsMap() {
      try {
        return JSON.parse(localStorage.getItem('shame_user_reactions') || '{}');
      } catch (e) {
        return {};
      }
    }

    function getUserReaction(entryId) {
      const reactions = getUserReactionsMap();
      return reactions[String(entryId)] || null;
    }

    function setUserReaction(entryId, emoji) {
      const reactions = getUserReactionsMap();
      reactions[String(entryId)] = emoji;
      localStorage.setItem('shame_user_reactions', JSON.stringify(reactions));
    }

    const POPULAR_EMOJIS = ['🐳', '❤️', '😡', '😱', '🔥'];
    let openReactionPickerId = null;

    function buildReactionsHtml(item) {
      const reactions = item.reactions || {};
      const userReactionKey = getUserReaction(item.id);

      // Пілюлі показуємо тільки для емодзі, які вже отримали хоча б одну реакцію
      const usedPillsHtml = POPULAR_EMOJIS
        .filter(emoji => (reactions[emoji] || 0) > 0)
        .map(emoji => {
          const count = reactions[emoji] || 0;
          const isMine = userReactionKey === emoji;
          return `
            <button class="reaction-btn ${isMine ? 'is-mine' : ''}" onclick="handleReaction(${item.id}, '${emoji}')">
              <span>${emoji}</span>
              <span class="reaction-count">${count}</span>
            </button>
          `;
        }).join('');

      const pickerEmojisHtml = POPULAR_EMOJIS.map(emoji => `
        <button class="reaction-picker-emoji" onclick="handleReaction(${item.id}, '${emoji}')">${emoji}</button>
      `).join('');

      return `
        ${usedPillsHtml}
        <div class="reaction-add-wrapper">
          <button class="reaction-add-btn" onclick="toggleReactionPicker(event, ${item.id})">+</button>
          <div class="reaction-picker" id="reaction-picker-${item.id}">${pickerEmojisHtml}</div>
        </div>
      `;
    }

    function toggleReactionPicker(e, entryId) {
      e.stopPropagation();
      const picker = document.getElementById(`reaction-picker-${entryId}`);
      if (!picker) return;

      const isOpen = picker.classList.contains('open');
      closeAllReactionPickers();
      if (!isOpen) {
        picker.classList.add('open');
        openReactionPickerId = entryId;
      }
    }

    function closeReactionPicker(entryId) {
      const picker = document.getElementById(`reaction-picker-${entryId}`);
      if (picker) picker.classList.remove('open');
      if (openReactionPickerId === entryId) openReactionPickerId = null;
    }

    function closeAllReactionPickers() {
      document.querySelectorAll('.reaction-picker.open').forEach(p => p.classList.remove('open'));
      openReactionPickerId = null;
    }

    // Закриваємо панель вибору емодзі при кліку будь-де поза нею
    document.addEventListener('click', closeAllReactionPickers);

    async function handleReaction(entryId, emoji) {
      const previousEmoji = getUserReaction(entryId);
      closeReactionPicker(entryId);

      if (previousEmoji === emoji) {
        // Вже поставив саме цю реакцію - ігноруємо повторний клік
        return;
      }

      const entry = cachedShameEntries.find(e => e.id === entryId);
      if (!entry) return;
      if (!entry.reactions) entry.reactions = {};

      // Якщо раніше стояла інша реакція - лічильник на сервері не зменшуємо навмисно,
      // щоб не ускладнювати - старий "голос" просто більше не позначений як "мій"
      setUserReaction(entryId, emoji);
      entry.reactions[emoji] = (entry.reactions[emoji] || 0) + 1;

      // Перемальовуємо блок реакцій цілком - працює однаково і з пілюлі, і з панелі
      const bar = document.getElementById(`reactions-bar-${entryId}`);
      if (bar) {
        bar.innerHTML = buildReactionsHtml(entry);
        const newPill = bar.querySelector('.reaction-btn.is-mine');
        if (newPill) {
          newPill.classList.add('just-reacted');
          setTimeout(() => newPill.classList.remove('just-reacted'), 300);
        }
      }

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.rpc('increment_reaction', {
            entry_id_input: entryId,
            emoji_key: emoji
          });
          if (error) throw error;
        } catch (err) {
          console.warn("Reaction error:", err);
        }
      }
    }

    // ------------------------------------------------------------------
    // Коментарі під постами дошки ганьби
    // ------------------------------------------------------------------
    const commentsCache = {};      // entryId -> array of comments
    const loadedComments = {};     // entryId -> bool (уже завантажено)
    const demoCommentsFallback = { text: "Поки що ніхто не прокоментував 🤐" };

    function toggleComments(entryId, btn) {
      const section = document.getElementById(`comments-section-${entryId}`);
      if (!section) return;

      const isOpen = section.classList.contains('open');
      if (isOpen) {
        section.classList.remove('open');
        return;
      }

      section.classList.add('open');

      if (!loadedComments[entryId]) {
        loadCommentsForEntry(entryId);
      }
    }

    async function loadCommentsForEntry(entryId) {
      const listEl = document.getElementById(`comments-list-${entryId}`);
      if (!listEl) return;

      listEl.innerHTML = '<div class="comment-empty">⏳ Завантаження...</div>';

      let comments = [];

      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('comments')
            .select('*')
            .eq('entry_id', entryId)
            .order('created_at', { ascending: true });

          if (error) throw error;
          comments = data || [];
        } catch (err) {
          console.warn("Supabase comments load error:", err);
          comments = [];
        }
      }

      commentsCache[entryId] = comments;
      loadedComments[entryId] = true;
      renderComments(entryId);
    }

    function renderComments(entryId) {
      const listEl = document.getElementById(`comments-list-${entryId}`);
      if (!listEl) return;

      const comments = commentsCache[entryId] || [];

      if (comments.length === 0) {
        listEl.innerHTML = `<div class="comment-empty">${escapeHtml(demoCommentsFallback.text)}</div>`;
        return;
      }

      listEl.innerHTML = comments.map(c => `
        <div class="comment-item">
          <div class="comment-author">${escapeHtml(c.author)}</div>
          <div class="comment-text">${escapeHtml(c.text)}</div>
        </div>
      `).join('');

      listEl.scrollTop = listEl.scrollHeight;
    }

    async function handleCommentSubmit(e, entryId) {
      e.preventDefault();
      const form = e.target;
      const authorInput = form.querySelector('.comment-author-input');
      const textInput = form.querySelector('.comment-text-input');
      const submitBtn = form.querySelector('.comment-submit-btn');

      const author = authorInput.value.trim();
      const text = textInput.value.trim();
      if (!author || !text) return;

      submitBtn.disabled = true;
      submitBtn.textContent = '...';

      try {
        if (supabaseClient) {
          const { error } = await supabaseClient
            .from('comments')
            .insert([{ entry_id: entryId, author, text }]);

          if (error) throw error;
        }

        // Оптимістичне оновлення - додаємо коментар одразу у список
        if (!commentsCache[entryId]) commentsCache[entryId] = [];
        commentsCache[entryId].push({ author, text, created_at: new Date().toISOString() });
        renderComments(entryId);

        form.reset();
      } catch (err) {
        console.warn("Comment submit error:", err);
        alert("Не вдалося надіслати коментар 😢 Спробуй ще раз.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Надіслати';
      }
    }

    function openShameModal() {
      document.getElementById('modalError').style.display = 'none';
      document.getElementById('shameForm').reset();
      document.getElementById('fileLabel').textContent = '📁 Тисни сюди для вибору фото';
      document.getElementById('shameModal').classList.add('open');
    }

    function closeShameModal() {
      document.getElementById('shameModal').classList.remove('open');
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      const label = document.getElementById('fileLabel');
      if (file) {
        if (file.size > 15 * 1024 * 1024) {
          showModalError("Файл занадто великий! Максимум 15 МБ 💥");
          e.target.value = '';
          label.textContent = '📁 Тисни сюди для вибору фото';
          return;
        }
        label.textContent = `📸 Обрано: ${file.name} (${(file.size / (1024*1024)).toFixed(1)} МБ)`;
      }
    }

    function showModalError(msg) {
      const errBox = document.getElementById('modalError');
      errBox.textContent = msg;
      errBox.style.display = 'block';
    }

    async function handleShameSubmit(e) {
      e.preventDefault();

      const nameVal = document.getElementById('shameName').value.trim();
      const reasonVal = document.getElementById('shameReason').value.trim();
      const photoInput = document.getElementById('shamePhoto');
      const passVal = document.getElementById('shamePassword').value;

      const submitBtn = document.getElementById('btnSubmitShame');
      const submitText = document.getElementById('submitBtnText');

      // 1. Перевірка пароля
      if (passVal !== "anime") {
        showModalError("Пароль невірний, ти не з наших 👀");
        return;
      }

      // 2. Перевірка файлу
      const file = photoInput.files[0];
      if (!file) {
        showModalError("Будь ласка, завантажте фото-доказ! 📸");
        return;
      }

      if (!file.type.startsWith('image/')) {
        showModalError("Приймаються тільки зображення! 🖼️");
        return;
      }

      if (file.size > 15 * 1024 * 1024) {
        showModalError("Файл перевищує 15 МБ! 💥");
        return;
      }

      submitBtn.disabled = true;
      submitText.innerHTML = '<span class="spinner"></span> ВАНТАЖИМО...';

      try {
        let photoUrl = "";

        if (supabaseClient) {
          const fileExt = file.name.split('.').pop();
          const filePath = `public/${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;

          const { data: uploadData, error: uploadErr } = await supabaseClient.storage
            .from('board-photos')
            .upload(filePath, file);

          if (uploadErr) throw uploadErr;

          const { data: urlData } = supabaseClient.storage
            .from('board-photos')
            .getPublicUrl(filePath);

          photoUrl = urlData.publicUrl;

          const { error: insertErr } = await supabaseClient
            .from('board_entries')
            .insert([
              { name: nameVal, reason: reasonVal, photo_url: photoUrl }
            ]);

          if (insertErr) throw insertErr;
        } else {
          photoUrl = URL.createObjectURL(file);
          const newEntry = {
            id: Date.now(),
            name: nameVal,
            reason: reasonVal,
            photo_url: photoUrl,
            created_at: new Date().toISOString()
          };
          cachedShameEntries.unshift(newEntry);
        }

        spawnConfettiBurst(40);
        closeShameModal();
        loadShameEntries();

      } catch (err) {
        console.error("Submission error:", err);
        showModalError(`Помилка: ${err.message || 'Не вдалося завантажити'}`);
      } finally {
        submitBtn.disabled = false;
        submitText.textContent = '🔥 ОПУБЛІКУВАТИ';
      }
    }

    async function clearBoard() {
      const password = prompt("Введи адмін-пароль:");
      if (password === null) return;

      if (password !== "kaceta") {
        showModalError("Невірний пароль 🚫");
        openShameModal();
        return;
      }

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from('board_entries')
            .delete()
            .neq('id', 0);

          if (error) {
            console.error("Помилка видалення Supabase:", error);
            showModalError("Не вдалося очистити дошку в Supabase 💥");
            openShameModal();
            return;
          }
        } catch (err) {
          console.error("Clear error:", err);
        }
      }

      cachedShameEntries = [];
      renderShameGrid(cachedShameEntries);
      spawnConfettiBurst(20);
    }

    // ------------------------------------------------------------------
    // Надійний фікс мерехтіння при швидкому наведенні (z-index race)
    // Замінює ненадійний CSS transition-delay трюк на JS з відміною таймера
    // ------------------------------------------------------------------
    function initHoverZIndexFix(selector, baseZIndex, releaseDelayMs) {
      const pendingTimers = new WeakMap();
      let zCounter = baseZIndex;

      document.addEventListener('mouseover', (e) => {
        const el = e.target.closest(selector);
        if (!el) return;

        if (pendingTimers.has(el)) {
          clearTimeout(pendingTimers.get(el));
          pendingTimers.delete(el);
        }
        zCounter += 1;
        el.style.zIndex = zCounter;
      }, true);

      document.addEventListener('mouseout', (e) => {
        const el = e.target.closest(selector);
        if (!el) return;
        if (el.contains(e.relatedTarget)) return; // йдемо всередину дочірнього елемента, не рахується

        const timerId = setTimeout(() => {
          el.style.zIndex = '';
          pendingTimers.delete(el);
        }, releaseDelayMs);
        pendingTimers.set(el, timerId);
      }, true);
    }

    initHoverZIndexFix('.cal-cell', 50, 140);
    initHoverZIndexFix('.shame-card', 20, 220);

    function initFloatingBackground() {
      // Прибрано за проханням користувача - мультяшний плаваючий фон
      // виглядав занадто "іграшково" для серйозного проєкту.
      const container = document.getElementById('floatingBg');
      if (!container) return;
      container.innerHTML = '';
    }

    function escapeHtml(str) {
      if (!str) return '';
      const p = document.createElement('p');
      p.textContent = str;
      return p.innerHTML;
    }

    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnConfettiBurst(amount = 35) {
      const colors = ['#C6FF3D', '#FF4FD8', '#FFD400', '#00F5D4', '#FF3366'];
      for (let i = 0; i < amount; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 18,
          vy: (Math.random() - 0.8) * 16,
          rot: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 12,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 8 + Math.random() * 8,
          alpha: 1
        });
      }
      startConfettiLoopIfNeeded();
    }

    let confettiLoopRunning = false;

    function confettiLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.rot += p.vRot;
        p.alpha -= 0.016;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.strokeRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();

        if (p.alpha <= 0) particles.splice(i, 1);
      }

      if (particles.length > 0) {
        requestAnimationFrame(confettiLoop);
      } else {
        confettiLoopRunning = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function startConfettiLoopIfNeeded() {
      if (!confettiLoopRunning) {
        confettiLoopRunning = true;
        requestAnimationFrame(confettiLoop);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initFloatingBackground();
      renderSchedule();
      updateClockAndCountdown();
      setInterval(updateClockAndCountdown, 1000);
    });
  </script>
