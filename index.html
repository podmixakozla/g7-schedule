<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>РОЗКЛАД НТУ ДП // G7 + ДОШКА ГАНЬБИ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23E8B93E'/><text y='.9em' x='50' text-anchor='middle' font-size='72'>📅</text></svg>">

  <!-- Жирні шрифти з сильним характером -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@600;700;900&display=swap" rel="stylesheet">

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Telegram WebApp SDK — must load before auth.js -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app-container.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/schedule.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/shame.css">
  <link rel="stylesheet" href="css/reactions.css">
  <link rel="stylesheet" href="css/comments.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/confetti.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Плаваючі фонові елементи -->
  <div class="bg-floating-container" id="floatingBg"></div>

  <!-- Конфетті canvas -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Auth Overlay -->
  <div class="auth-overlay" id="authOverlay"></div>

  <div class="app-container">
    
    <header class="header">
      <div class="header-main">
        <div class="tags-row">
          <div class="badge-pill">🔥 НТУ ДП · 1899</div>
          <div class="badge-pill cyan">🎓 СПЕЦІАЛЬНІСТЬ G7</div>
        </div>
        <h1 class="main-title">РОЗКЛАД <span>G7</span> </h1>
      </div>

      <!-- Кнопки-перемикачі -->
      <div class="controls-wrapper">
        <button class="btn-brutal active" id="btnWeek" onclick="setViewMode('week')">
          📅 ВЕСЬ ТИЖДЕНЬ
        </button>
        <button class="btn-brutal pink-accent" id="btnToday" onclick="setViewMode('today')">
          ⚡ СЬОГОДНІ
        </button>
        <button class="btn-brutal yellow-accent" id="btnCalendar" onclick="setViewMode('calendar')">
          📆 КАЛЕНДАР 2026/27
        </button>
        <button class="btn-brutal red-accent" id="btnShame" onclick="setViewMode('shame')">
          💀 ДОШКА ГАНЬБИ
        </button>
      </div>
    </header>

    <!-- Основні секції -->
    <main class="schedule-grid" id="scheduleContainer"></main>

    <!-- Секція календаря -->
    <div class="calendar-wrapper" id="calendarContainer" style="display: none;">
      <div class="calendar-box">
        
        <!-- Sticky Legend -->
        <div class="legend-container sticky-legend">
          <span class="legend-title">📌 Позначення:</span>
          <div class="legend-item"><div class="legend-color-box theory"></div> Теоретичне</div>
          <div class="legend-item"><div class="legend-color-box control"></div> Контроль</div>
          <div class="legend-item"><div class="legend-color-box session"></div> Сесія 💀</div>
          <div class="legend-item"><div class="legend-color-box vacation"></div> Канікули ✨</div>
          <div class="legend-item"><div class="legend-color-box practice"></div> Практика</div>
          <div class="legend-item"><span class="legend-text-num">1</span> Чисельник</div>
          <div class="legend-item"><span class="legend-text-den">8</span> Знаменник</div>
        </div>

        <div class="calendar-actions">
          <button class="btn-brutal" id="btnToggleAllMonths" onclick="toggleAllMonths()">
            📂 ЗГОРНУТИ ВСІ / РОЗГОРНУТИ
          </button>
        </div>

        <!-- Сітка місяців -->
        <div class="months-grid" id="monthsGrid"></div>

      </div>
    </div>

    <div class="shame-wrapper" id="shameContainer" style="display: none;">
      <div class="shame-header-box">
        <div class="shame-title-area">
          <h2 class="shame-title">💀 ДОШКА ГАНЬБИ G7</h2>
          <p class="shame-subtitle">Ганьба.</p>
        </div>
        <button class="btn-brutal red-accent" onclick="openShameModal()">
          ➕ ДОДАТИ ГАНЕБНИКА
        </button>
      </div>

      <div class="shame-subtabs">
        <button class="btn-brutal active" id="btnShameNew" onclick="setShameSubView('new')">🆕 НОВІ</button>
        <button class="btn-brutal" id="btnShameTop" onclick="setShameSubView('top')">🏆 ТОП ТИЖНЯ/МІСЯЦЯ</button>
      </div>

      <div class="shame-grid" id="shameGrid"></div>
    </div>

    <!-- Футер -->
    <footer class="footer">
      <div class="footer-info">
        <span class="footer-tag">🏛️ НТУ «ДНІПРОВСЬКА ПОЛІТЕХНІКА»</span>
        <span class="footer-tag">🎓 СПЕЦІАЛЬНІСТЬ G7</span>
      </div>
      <div style="display: flex; align-items: center; gap: 0.4rem;">
        <div class="clock-badge" id="liveClock">⏰ Завантаження...</div>
        <button class="btn-clear-tiny" id="btnClearBoard" onclick="clearBoard()" title="Адмін-очищення" style="display: none;">🗑️</button>
      </div>
    </footer>
  </div>

  <!-- Модальне вікно "Додати на Дошку Ганьби" -->
  <div class="modal-backdrop" id="shameModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">💀 ДОДАТИ НА ДОШКУ</span>
        <button class="btn-close" onclick="closeShameModal()">✕</button>
      </div>

      <div class="error-banner" id="modalError"></div>

      <form id="shameForm" onsubmit="handleShameSubmit(event)">
        <div class="form-group">
          <label class="form-label">Ім'я / Нікнейм героя 🤡</label>
          <input type="text" id="shameName" class="form-input" placeholder="Хто потрапив на дошку?" required maxlength="100" />
        </div>

        <div class="form-group" style="margin-top: 0.8rem;">
          <label class="form-label">За що потрапив? 📝</label>
          <textarea id="shameReason" class="form-textarea" placeholder="Проспав першу пару, не здав лабу з кодингу..." required></textarea>
        </div>

        <div class="form-group" style="margin-top: 0.8rem;">
          <label class="form-label">Доказ (Фото, макс 15 МБ) 📸</label>
          <div class="file-input-wrapper">
            <span id="fileLabel">📁 Тисни сюди для вибору фото</span>
            <input type="file" id="shamePhoto" accept="image/*" onchange="handleFileSelect(event)" required />
          </div>
        </div>

        <div style="margin-top: 1.25rem;">
          <button type="submit" class="btn-brutal red-accent" id="btnSubmitShame" style="width: 100%; justify-content: center;">
            <span id="submitBtnText">🔥 ОПУБЛІКУВАТИ</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reactions.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/shame-board.js"></script>
  <script src="js/shame-form.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
